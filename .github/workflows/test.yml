name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: Test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: coverage.out
        continue-on-error: true

  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install substrate
        run: |
          curl -fsSL \
            https://github.com/scttfrdmn/substrate/releases/latest/download/substrate_linux_amd64.tar.gz \
            | tar xz -C /usr/local/bin substrate
          chmod +x /usr/local/bin/substrate

      - name: Start substrate
        run: substrate server --port 4566 &
        shell: bash

      - name: Wait for substrate
        run: |
          for i in $(seq 1 20); do
            curl -sf http://localhost:4566/health && break
            sleep 1
          done

      - name: Integration tests
        run: BURST_INTEGRATION_TEST=1 go test -v -timeout 10m ./...
        env:
          AWS_ENDPOINT_URL: http://localhost:4566
          AWS_ACCESS_KEY_ID: test
          AWS_SECRET_ACCESS_KEY: test
          AWS_DEFAULT_REGION: us-east-1
