version: 2

project_name: burst-core

before:
  hooks:
    - go mod tidy

builds:
  - id: burst-core
    main: ./cmd/burst-core
    binary: burst-core
    ldflags:
      - -s -w -X github.com/scttfrdmn/burst-core/cmd/burst-core/internal/version.Version={{.Version}}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      - goos: windows
        goarch: arm64

archives:
  - id: burst-core
    builds: [burst-core]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        format: zip

checksum:
  name_template: "checksums.txt"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^chore(deps)"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  github:
    owner: scttfrdmn
    name: burst-core
  draft: false
  prerelease: auto
  name_template: "{{.Tag}}"
